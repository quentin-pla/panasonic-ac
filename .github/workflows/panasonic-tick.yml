name: Panasonic AC tick

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 min — doc-blessed syntax (was '2-57/5' but GH never picked it up)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: panasonic-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      # actions/cache@v5 = restore on entry + save in post-step.
      # github.run_id is unique → exact key never pre-exists → cache always saves.
      # restore-keys falls back to latest pcc-state-* on cold start.
      - uses: actions/cache@v5
        with:
          path: state
          key: pcc-state-${{ github.run_id }}
          restore-keys: pcc-state-

      - name: Run tick
        env:
          PCC_REFRESH:     ${{ secrets.PCC_REFRESH }}
          PCC_DEVICE_GUID: ${{ vars.PCC_DEVICE_GUID }}
          NTFY_TOPIC:      ${{ secrets.NTFY_TOPIC }}
          PCC_DRY_RUN:     ${{ vars.PCC_DRY_RUN }}
        run: node gha/panasonic-tick.mjs
