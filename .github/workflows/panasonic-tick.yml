name: Panasonic AC tick

on:
  # Triggered externally by cron-job.org via the workflow_dispatch REST API.
  # GitHub's native schedule was unreliable — disabled here.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: panasonic-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      # actions/cache@v5 = restore on entry + save in post-step.
      # github.run_id is unique → exact key never pre-exists → cache always saves.
      # restore-keys falls back to latest pcc-state-* on cold start.
      - uses: actions/cache@v5
        with:
          path: state
          key: pcc-state-${{ github.run_id }}
          restore-keys: pcc-state-

      - name: Run tick
        env:
          # PCC_REFRESH (kept fresh by the writeback step below) exclusively.
          PCC_REFRESH:     ${{ secrets.PCC_REFRESH }}
          PCC_DEVICE_GUID: ${{ vars.PCC_DEVICE_GUID }}
          NTFY_TOPIC:      ${{ secrets.NTFY_TOPIC }}
          PCC_DRY_RUN:     ${{ vars.PCC_DRY_RUN }}
        run: node panasonic-tick.mjs

      # Durable refresh token: when the tick rotated it, refresh-token.new exists.
      # Pipe it into the PCC_REFRESH secret via stdin (never echoed → no log leak).
      # if: always() so it persists even if the tick failed after rotating.
      # Needs GH_PAT = fine-grained PAT with "Secrets: Read and write" on this repo.
      - name: Persist rotated refresh token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -s refresh-token.new ]; then
            gh secret set PCC_REFRESH --repo "$GITHUB_REPOSITORY" < refresh-token.new
            echo "PCC_REFRESH secret updated (token rotated this run)"
            rm -f refresh-token.new
          else
            echo "No refresh-token rotation this run — secret unchanged"
          fi
